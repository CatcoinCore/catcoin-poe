events {
    worker_connections 1024;
}

http {
    # The upstream is defined in an external file to allow for zero-downtime switching
    include /etc/nginx/conf.d/upstream.inc;

    server {
        listen 80;
        server_name poe.catcoin.in;

        # ACME HTTP-01 challenge for certbot in webroot mode. nginx holds port 80,
        # so `certbot --standalone` cannot be used; instead certbot writes the
        # challenge token into a webroot that is mounted here (see
        # docker-compose.prod.yml `./certbot-www:/var/www/certbot:ro` and
        # docs/cert-renewal.md). Renew with:
        #   certbot certonly --webroot -w ./certbot-www -d poe.catcoin.in
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else: redirect to HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name poe.catcoin.in;

        # SSL certificates (./ssl/fullchain.pem and privkey.pem — see ssl/README.md or generate_dev_ssl.sh)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Increase timeouts for long-running requests
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # API endpoint
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Silence external /queue probes (not part of our API)
        location = /queue {
            access_log off;
            return 204;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend/health;
            access_log off;
        }
    }
}
