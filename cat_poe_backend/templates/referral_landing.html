<!DOCTYPE html>
<html lang="en" data-invite-play="__PLAY_URL__" data-invite-ios="__IOS_URL__" data-invite-desktop="__DESKTOP_URL__">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catcoin — Invite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF5722;
            --bg: #121212;
            --card: #1E1E1E;
            --text: #FFFFFF;
            --text-dim: #B0B0B0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            width: 90%;
            text-align: center;
            padding: 40px 20px;
            background: var(--card);
            border-radius: 24px;
        }
        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--primary);
        }
        p { color: var(--text-dim); line-height: 1.5; }
        .code-box {
            background: #2A2A2A;
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 16px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 24px 0;
            cursor: pointer;
        }
        a.btn {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 20px;
            background: var(--primary);
            color: #fff;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You're invited</h1>
        <p id="msg">Opening the right store for your device…</p>
        <div class="code-box" id="referralCode" onclick="copyCode()">{{ code }}</div>
        <p class="hint" style="font-size:12px;color:#666">Tap the code to copy</p>
        <p><a class="btn" id="fallback" href="__DESKTOP_URL__">Continue</a></p>
    </div>
    <script>
        (function () {
            var root = document.documentElement;
            var play = root.getAttribute('data-invite-play') || '';
            var ios = root.getAttribute('data-invite-ios') || '';
            var desk = root.getAttribute('data-invite-desktop') || '';
            var ua = navigator.userAgent.toLowerCase();
            var target = desk;
            if (ua.indexOf('android') !== -1) target = play;
            else if (/iphone|ipad|ipod|crios\/|fxios\/|edgios\/|ipados/.test(ua)) target = ios;
            if (target) {
                document.getElementById('fallback').setAttribute('href', target);
                window.location.replace(target);
            }
        })();
        function copyCode() {
            var code = document.getElementById('referralCode').innerText.trim();
            navigator.clipboard.writeText(code).then(function () {
                var h = document.querySelector('.hint');
                h.innerText = 'Copied!';
                h.style.color = '#4CAF50';
            });
        }
    </script>
</body>
</html>
