name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cat_poe_backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: catpoe
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catcoin_poe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catpoe -d catcoin_poe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://catpoe:postgres@localhost:5432/catcoin_poe_test
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cat_poe_backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -q

  flutter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cat_poe

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('cat_poe/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        # google-services.json is gitignored; the unit/widget tests in test/
        # do not require Firebase initialization at runtime.
        run: flutter test --reporter expanded
