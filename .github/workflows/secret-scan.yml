name: Secret scan

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # scan full history, not just the last commit

      # Run the gitleaks CLI directly (official image). The gitleaks GitHub
      # Action requires a license key for organization-owned repositories;
      # the CLI does not. Uses the repo's .gitleaks.toml and redacts findings.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml \
            --redact --verbose --exit-code=1
